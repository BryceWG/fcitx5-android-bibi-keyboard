name: Build ARM64-v8a APK

on:
  push:
    branches:
      - master
      - feature/**
    paths-ignore:
      - '**.md'
      - '.github/workflows/fdroid.yml'
      - '.github/workflows/nix.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_ABI: arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build signed debug APK and run sync unit tests
        run: >-
          ./gradlew :app:assembleDebug :app:testDebugUnitTest
          --tests org.fcitx.fcitx5.android.rustclipsync.SyncStateTest
          --no-daemon --console=plain

      - name: Verify APK signature and architecture
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "${apks[0]}"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "${apks[0]}" > "$RUNNER_TEMP/apk-badging.txt"
          grep -E "^package: name='org\\.fcitx\\.fcitx5\\.android\\.debug' " "$RUNNER_TEMP/apk-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: rustclipsync-android-arm64-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
